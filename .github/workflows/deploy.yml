name: Deploy Backend (Monorepo Structure)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v3

      - name: 🔑 Set up SSH Agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: 🌐 Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      #########################################
      # FRONTEND BUILD
      #########################################
      - name: 🏗️ Build Frontend
        run: |
          cd git/demo/frontend
          npm ci
          npm run build
          
          echo "✅ Frontend Build abgeschlossen"
          ls -la dist/

      #########################################
      # BACKUP ALTE VERSION
      #########################################
      - name: 💾 Backup Old Backend
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /home/${{ secrets.SERVER_USER }}/app

            # Backup erstellen (falls backend existiert)
            if [ -d "backend" ]; then
              BACKUP_DIR=~/backups/backend_backup_$(date +%Y%m%d_%H%M%S)
              mkdir -p $BACKUP_DIR
              
              echo "📦 Sichere altes Backend..."
              cp -r backend $BACKUP_DIR/
              
              # Auch .env sichern
              if [ -f .env ]; then
                cp .env $BACKUP_DIR/.env
              fi
              
              echo "✅ Backup erstellt: $BACKUP_DIR"
            fi
          EOF

      #########################################
      # DEPLOY GO BACKEND
      #########################################
      - name: 🖥️ Deploy Go Backend
        run: |
          rsync -av \
            --exclude '.env' \
            --exclude '.env.production' \
            --exclude 'vendor' \
            --exclude '.git' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./git/demo/backend-go/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/backend-go/
          
          echo "✅ Go Backend deployed zu ~/app/backend-go/"

      #########################################
      # DEPLOY FRONTEND BUILD
      #########################################
      - name: 📂 Deploy Frontend Build
        run: |
          # Erstelle frontend_dist falls nicht existiert
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p /home/${{ secrets.SERVER_USER }}/app/frontend_dist"
          
          # Deploy Frontend Build zu frontend_dist/
          rsync -av --delete \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./git/demo/frontend/dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/frontend_dist/
          
          echo "✅ Frontend deployed zu ~/app/frontend_dist/"

      #########################################
      # DEPLOY MIGRATIONS
      #########################################
      - name: 📊 Deploy Migrations
        run: |
          # Erstelle migrations Ordner
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p /home/${{ secrets.SERVER_USER }}/app/migrations"
          
          # Deploy Migrations
          rsync -av --delete \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./git/demo/backend-go/migrations/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/migrations/
          
          echo "✅ Migrations deployed zu ~/app/migrations/"

      #########################################
      # DEPLOY NGINX CONFIG
      #########################################
      - name: 🌐 Deploy Nginx Config
        run: |
          # Deployed bisher gezielt "nginx.prod.conf" - eine Datei, die es im
          # Repo gar nicht (mehr) gibt, der Schritt war also faktisch ein
          # No-Op. Jetzt wird der komplette nginx/-Ordner synchronisiert
          # (conf.d-Fragmente + Dockerfile für den periodischen Cert-Reload,
          # siehe nginx/Dockerfile). Bewusst ohne --delete, um nichts zu
          # löschen, das eventuell manuell auf dem Server liegt.
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p /home/${{ secrets.SERVER_USER }}/app/nginx"

          rsync -av \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./git/demo/nginx/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/nginx/

          echo "✅ Nginx Config (inkl. Dockerfile) deployed"

      #########################################
      # DEPLOY DOCKER COMPOSE
      #########################################
      - name: 🐳 Deploy Docker Compose
        run: |
          # Deploy docker-compose.prod.yml
          scp -o StrictHostKeyChecking=yes \
            ./git/demo/docker-compose.prod.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/
          
          echo "✅ docker-compose.prod.yml deployed"

      #########################################
      # DEPLOY MIGRATION SCRIPT
      #########################################
      - name: 📜 Deploy Migration Script
        run: |
          # Deploy migrate-initial-SAFE.sh
          if [ -f "./git/demo/migrate-initial-SAFE.sh" ]; then
            scp -o StrictHostKeyChecking=yes \
              ./git/demo/migrate-initial-SAFE.sh \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/
            
            # Executable machen
            ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "chmod +x /home/${{ secrets.SERVER_USER }}/app/migrate-initial-SAFE.sh"
            
            echo "✅ Migration Script deployed"
          fi

      #########################################
      # APPLY DOCKER COMPOSE (BUILD + RESTART)
      #########################################
      - name: 🚀 Apply Docker Compose (Build + Restart)
        run: |
          # Bisher endete die Pipeline damit, Dateien auf den Server zu legen -
          # niemand hat sie tatsächlich angewendet, das war ein manueller
          # Schritt. Jetzt baut/started dieser Schritt die Container direkt:
          # backend-go, das Serving von frontend_dist über nginx, und nginx
          # selbst (jetzt mit eigenem Dockerfile für den periodischen
          # Cert-Reload, siehe nginx/Dockerfile) neu.
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd /home/${{ secrets.SERVER_USER }}/app && docker compose -f docker-compose.prod.yml up -d --build"

          echo "✅ Container gebaut und neu gestartet"

      #########################################
      # WARNUNG - MANUELLE SCHRITTE
      #########################################
      - name: ⚠️ Manuelle Schritte erforderlich
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  DEPLOYMENT ABGESCHLOSSEN - MANUELLE SCHRITTE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📦 Deployed UND angewendet (docker compose up -d --build):"
          echo "  ✅ backend-go/        (Neues Go Backend)"
          echo "  ✅ frontend_dist/     (Frontend Build)"
          echo "  ✅ migrations/        (DB Migrations, noch nicht ausgeführt)"
          echo "  ✅ nginx/             (conf.d-Fragmente + Dockerfile)"
          echo "  ✅ docker-compose.prod.yml"
          echo "  ✅ migrate-initial-SAFE.sh"
          echo ""
          echo "⚠️  NICHT deployed (bleiben unverändert):"
          echo "  ✅ .env               (Original bleibt!)"
          echo "  ✅ backend/           (Altes Backend bleibt!)"
          echo "  ✅ frontend/          (Bleibt!)"
          echo "  ✅ logs/, certs/, postgres/, etc."
          echo ""
          echo "🔧 EINZIGER VERBLEIBENDER MANUELLER SCHRITT (auf Server):"
          echo ""
          echo "  Migration starten (bewusst nicht automatisiert - DB-Änderungen"
          echo "  sollen ein manueller, bewusster Schritt bleiben):"
          echo "     ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          echo "     cd /home/${{ secrets.SERVER_USER }}/app && ./migrate-initial-SAFE.sh"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      #########################################
      # SUCCESS
      #########################################
      - name: ✅ Deployment Files Ready
        run: |
          echo "✅ Alle Files für Migration sind auf dem Server!"
          echo "📋 Nächster Schritt: SSH auf Server und Migration starten"
