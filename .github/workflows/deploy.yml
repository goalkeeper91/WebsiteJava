name: Deploy Backend on Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v3

      - name: 🔑 Set up SSH Agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: 🌐 Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 🏗️ Build Frontend
      - name: 🏗️ Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # 🚀 Deploy Go Backend
      - name: 🖥️ Deploy Go Backend
        run: |
          rsync -av --delete \
            --exclude '.env' \
            --exclude '.env.production' \
            --exclude 'vendor' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./backend-go/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/backend-go/

      # 📂 Deploy Frontend Build
      - name: 📂 Deploy Frontend Build
        run: |
          rsync -av --delete \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./frontend/dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/frontend/dist/

      # 🗄️ Deploy Migrations
      - name: 📊 Deploy Migrations
        run: |
          rsync -av --delete \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./backend-go/migrations/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/migrations/

      # 📋 Deploy Nginx Config
      - name: 🌐 Deploy Nginx Config
        run: |
          rsync -av \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./nginx/nginx.prod.conf \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/nginx/

      # 🐳 Deploy Backend
      - name: 🐳 Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /home/${{ secrets.SERVER_USER }}/app
            
            echo "🏗️ Building Go Backend..."
            docker compose -f docker-compose.prod.yml build --no-cache backend-go
            
            echo "🚀 Restarting Backend & Nginx..."
            docker compose -f docker-compose.prod.yml up -d backend-go nginx
            
            echo "🧹 Cleaning up..."
            docker image prune -f
            
            echo ""
            echo "✅ Backend Deployment abgeschlossen!"
            echo "📊 Service Status:"
            docker compose -f docker-compose.prod.yml ps backend-go nginx
          EOF

      # 🔍 Health Check
      - name: 🏥 Health Check
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "⏳ Warte 15s auf Service Start..."
            sleep 15
            
            echo "🔍 Backend Health Check..."
            if curl -f http://localhost/health; then
              echo ""
              echo "✅ Backend ist healthy!"
            else
              echo ""
              echo "❌ Health Check fehlgeschlagen!"
              docker compose -f ~/app/docker-compose.prod.yml logs --tail=50 backend-go
              exit 1
            fi
          EOF

      - name: 🎉 Success
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 Deployment erfolgreich!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Tag: ${{ github.ref_name }}"
          echo "✅ Backend deployed"
          echo "✅ Frontend deployed"
          echo "✅ Migrations deployed"
