name: Deploy on Tag

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v1.0.1 etc.

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v3

      - name: 🔑 Set up SSH Agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: 🌐 Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 🏗️ Build Frontend
      - name: 🏗️ Build Frontend
        run: |
          cd git/demo/frontend
          npm ci
          npm run build

      # 🚀 Copy Backend + Config to Server
      - name: 🖥️ Copy Backend & Config to Server
        run: |
          rsync -av --delete \
          --exclude 'node_modules' \
          --exclude 'logs' \
          --exclude '.env' \              # NEU: .env nicht löschen!
          --exclude 'frontend_dist' \
          -e "ssh -o StrictHostKeyChecking=yes" \
          ./git/demo/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/

      # 🚀 Copy Frontend Build to Server
      - name: 📂 Deploy Frontend Build
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "rm -rf /home/${{ secrets.SERVER_USER }}/app/frontend_dist/*"
          rsync -av --delete \
          -e "ssh -o StrictHostKeyChecking=yes" \
          ./git/demo/frontend/dist/ \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/app/frontend_dist/


      # 🐳 Deploy Backend & Restart Proxy
      - name: 🐳 Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /home/${{ secrets.SERVER_USER }}/app
            
            # Radikales Aufräumen der alten Java-Builds auf dem Host
            rm -rf backend/target
            
            # Docker-Build ohne Cache erzwingen für maximale Sauberkeit
            docker compose -f docker-compose.prod.yml build --no-cache backend
            
            # Services neu starten
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Aufräumen
            docker image prune -f
          EOF
