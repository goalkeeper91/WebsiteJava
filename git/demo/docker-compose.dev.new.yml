version: '3.8'

services:
  # =========================
  # PostgreSQL Datenbank
  # =========================
  postgres:
    image: postgres:15-alpine
    container_name: goalkeeper_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twitch_auth}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-twitch_auth}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # =========================
  # Redis (Bot-Kommunikation)
  # =========================
  redis:
    image: redis:7-alpine
    container_name: goalkeeper_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =========================
  # Liquibase (Migrations)
  # =========================
  liquibase:
    image: liquibase/liquibase:4.25
    container_name: goalkeeper_liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend-go/migrations/liquibase:/liquibase/changelog
    command:
      - --changelog-file=changelog_master.xml
      - --search-path=/liquibase/changelog
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}
      - update
    networks:
      - app-network

  # =========================
  # Go Backend
  # =========================
  backend-go:
    build:
      context: ./backend-go
      dockerfile: docker/Dockerfile
    container_name: goalkeeper_backend_go
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Server
      PORT: 8080
      ENVIRONMENT: development

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-twitch_auth}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_SSLMODE: disable
      DB_MAX_OPEN_CONNS: 25
      DB_MAX_IDLE_CONNS: 5

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

      # Session
      SESSION_NAME: twitch_auth_session
      SESSION_MAX_AGE: 86400
      SESSION_SECURE: false
      SESSION_HTTP_ONLY: true
      SESSION_SAME_SITE: lax

      # Frontend
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ALLOWED_ORIGINS: http://localhost,http://localhost:5173,http://localhost:80
    expose:
      - "8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================
  # Frontend (Vite Dev)
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: goalkeeper_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=ws://localhost/ws
      - VITE_BACKEND_URL=http://localhost
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network
    command: npm run dev

  # =========================
  # Nginx Reverse Proxy
  # =========================
  proxy:
    image: nginx:1.25-alpine
    container_name: goalkeeper_nginx
    restart: unless-stopped
    depends_on:
      - backend-go
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# =========================
# Volumes
# =========================
volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local

# =========================
# Networks
# =========================
networks:
  app-network:
    name: goalkeeper_shared_network
    driver: bridge