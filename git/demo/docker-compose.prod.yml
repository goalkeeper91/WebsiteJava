services:
  # =========================
  # PostgreSQL Datenbank
  # =========================
  postgres:
    image: postgres:15-alpine
    container_name: goalkeeper_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twitch_auth}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-twitch_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # =========================
  # Redis (Bot-Kommunikation)
  # =========================
  redis:
    image: redis:7-alpine
    container_name: goalkeeper_redis_prod
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =========================
  # Liquibase (Migrations)
  # =========================
  liquibase:
    image: liquibase/liquibase:4.25
    container_name: goalkeeper_liquibase_prod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/liquibase:/liquibase/changelog
    command:
      - --changelog-file=changelog_master.xml
      - --search-path=/liquibase/changelog
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}
      - update
    networks:
      - app-network
    restart: "no"

  # =========================
  # Go Backend
  # =========================
  backend-go:
    build:
      context: ./backend-go
      dockerfile: docker/Dockerfile
    container_name: goalkeeper_backend_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    environment:
      # Server
      PORT: 8080
      ENVIRONMENT: production

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-twitch_auth}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSLMODE: disable
      DB_MAX_OPEN_CONNS: 25
      DB_MAX_IDLE_CONNS: 5

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

      # Twitch OAuth
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      TWITCH_REDIRECT_URL: ${TWITCH_REDIRECT_URL}
      TWITCH_ADMIN_TWITCH_ID: ${TWITCH_ADMIN_TWITCH_ID}
      ADMIN_TWITCH_ID: ${TWITCH_ADMIN_TWITCH_ID}

      # Discord OAuth (never wired in here before - client_id came through
      # empty, breaking both "Connect Discord" and "Invite Bot" with Discord
      # rejecting the empty client_id as an invalid snowflake)
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URL: ${DISCORD_REDIRECT_URL}
      DISCORD_PERMISSIONS: ${DISCORD_BOT_PERMISSIONS:-8}

      # Subathon Timer EventSub webhook (Twitch signs deliveries with this
      # secret; callback URL must be publicly reachable, no localhost default)
      SUBATHON_EVENTSUB_SECRET: ${SUBATHON_EVENTSUB_SECRET}
      SUBATHON_CALLBACK_URL: ${SUBATHON_CALLBACK_URL:-https://goalkeeper91.de/api/subathon/eventsub/callback}

      # Paddle Billing (SaaS Phase 1)
      PADDLE_API_BASE_URL: ${PADDLE_API_BASE_URL:-https://api.paddle.com}
      PADDLE_API_KEY: ${PADDLE_API_KEY}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET}
      PADDLE_CLIENT_SIDE_TOKEN: ${PADDLE_CLIENT_SIDE_TOKEN}
      PADDLE_PRICE_PRO_MONTHLY: ${PADDLE_PRICE_PRO_MONTHLY}
      PADDLE_PRICE_PRO_YEARLY: ${PADDLE_PRICE_PRO_YEARLY}
      PADDLE_PRICE_PREMIUM_MONTHLY: ${PADDLE_PRICE_PREMIUM_MONTHLY}
      PADDLE_PRICE_PREMIUM_YEARLY: ${PADDLE_PRICE_PREMIUM_YEARLY}

      # Security
      GO_APP_SECRET_KEY: ${GO_APP_SECRET_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
      SESSION_NAME: twitch_auth_session
      SESSION_MAX_AGE: 86400
      SESSION_SECURE: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax

      # Frontend
      FRONTEND_URL: ${FRONTEND_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

      # Ollama (Phase D: selbstgehostete KI-Caption)
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    expose:
      - "8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================
  # Ollama (Phase D: selbstgehostete KI-Caption, keine externen API-Kosten)
  # =========================
  ollama:
    image: ollama/ollama:latest
    container_name: goalkeeper_ollama_prod
    restart: unless-stopped
    volumes:
      - ollama_data_prod:/root/.ollama
    expose:
      - "11434"
    networks:
      - app-network

  # =========================
  # Clip-Detector (Phase B: Audio/Video-Heuristiken, v1 nur Allowlist-Kanäle)
  # =========================
  clip-detector:
    build:
      context: ./backend-go
      dockerfile: docker/Dockerfile.detector
    container_name: goalkeeper_clip_detector_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-twitch_auth}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSLMODE: disable

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      # Twitch (App Access Token für Live-Status-Checks)
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      TWITCH_REDIRECT_URL: ${TWITCH_REDIRECT_URL}

      # Config.Load() validiert diese Felder mit, auch wenn der Detector sie
      # selbst nicht braucht (gleiches config-Package wie backend-go) —
      # dieselben Werte wie oben wiederverwenden.
      GO_APP_SECRET_KEY: ${GO_APP_SECRET_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}

      # Kapazitätsgrenze (Phase 3): max. gleichzeitig laufende ffmpeg/streamlink-
      # Ingestoren. Zugriffskontrolle läuft seit Phase 2 über echte Abo-Daten,
      # nicht mehr über eine manuelle Allowlist.
      MAX_CONCURRENT_INGESTORS: ${MAX_CONCURRENT_INGESTORS:-20}
    networks:
      - app-network

  # =========================
  # Nginx Reverse Proxy
  # =========================
  nginx:
    build:
      context: ./nginx
    container_name: goalkeeper_nginx_prod
    restart: unless-stopped
    depends_on:
      backend-go:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/n8n.conf:/etc/nginx/conf.d/n8n.conf:ro
      - ./nginx/punishersgermany.conf:/etc/nginx/conf.d/punishersgermany.conf:ro
      - ./nginx/vault.punishersgermany.conf:/etc/nginx/conf.d/vault.punishersgermany.conf:ro
      - ./frontend_dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =========================
  # Adminer (Datenbank UI)
  # =========================
  adminer:
    image: adminer:latest
    container_name: goalkeeper_adminer_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - app-network

  # =========================
  # n8n Workflow Automation
  # =========================
  n8n:
    image: n8nio/n8n:latest
    container_name: goalkeeper_n8n_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database (n8n verwendet eigene Tabellen in gleicher DB)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-postgres}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n

      # n8n Configuration
      N8N_HOST: n8n.goalkeeper91.de
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.goalkeeper91.de/

      # Security
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_AUTH_PASSWORD}

      # Encryption
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Editor
      N8N_EDITOR_BASE_URL: https://n8n.goalkeeper91.de/

      # Timezone
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin

      # Execution
      EXECUTIONS_PROCESS: main
      EXECUTIONS_MODE: regular

      # Logs
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/backup:/backup
    expose:
      - "5678"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# =========================
# Volumes
# =========================
volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  n8n_data:
    driver: local
  ollama_data_prod:
    driver: local

# =========================
# Networks
# =========================
networks:
  app-network:
    name: goalkeeper_prod_network
    driver: bridge