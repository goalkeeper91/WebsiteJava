services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Die Log-Ebene wird jetzt direkt im "command" gesetzt, sodass diese hier nicht mehr nötig ist.
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - app-network
    command: ["java", "-Dlogging.level.root=TRACE", "-jar", "app.jar"]

  redis:
    image: redis:7
    container_name: redis_central
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    env_file:
      - .env
    volumes:
      - frontend_build:/app/dist
    networks:
      - app-network

  postgres:
    image: postgres:15
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -q"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  proxy:
    image: nginx:stable-alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/timer.conf:/etc/nginx/conf.d/timer.conf:ro
      - ./certs:/etc/nginx/certs
      - ./certbot-www:/var/www/certbot
      - ./frontend/dist:/var/www/frontend:ro
      - ./subathon-timer:/var/www/subathon:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - app-network

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    networks:
      - app-network

  certbot-renew:
    image: certbot/certbot
    container_name: certbot_renewer
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --quiet --webroot -w /var/www/certbot; sleep 86400; done"
    networks:
      - app-network

volumes:
  postgres_data:
  frontend_build:

networks:
  app-network:
    driver: bridge
