<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No static <meta name="description">/OG/Twitter tags here on purpose:
      react-helmet-async (see src/components/Seo.tsx) does NOT remove
      pre-existing non-Helmet tags from the DOM, it only appends its own -
      so a static description here would sit alongside each page's Helmet
      one as a duplicate tag, and both browsers and search engines resolve
      duplicates by taking the FIRST occurrence, silently overriding every
      route's actual per-page description with whatever static default
      lived here. Every real route (including "/") renders <Seo> as the
      single source of truth for title/description/OG/Twitter/canonical.
    -->
    <title>Goalkeeper91</title>
    <script type="application/ld+json" id="global-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Goalkeeper91",
        "alternateName": "Marcel Turlach - Softwareentwicklung",
        "url": "https://goalkeeper91.de",
        "logo": "https://goalkeeper91.de/images/goalkeeper_logo.png",
        "image": "https://goalkeeper91.de/images/goalkeeper_logo.png",
        "description": "Individuelle Softwareentwicklung (Web, Mobile, Automatisierung) sowie ein SaaS Twitch-Chatbot mit Automod, Loyalty-Punkten, Giveaways und automatischer Clip-Erstellung.",
        "areaServed": "DE",
        "founder": {
          "@type": "Person",
          "name": "Marcel Turlach"
        },
        "sameAs": [
          "https://www.twitch.tv/goalkeeper91",
          "https://www.youtube.com/@goalkeeper91UNCUT",
          "https://www.tiktok.com/@g04lkeeper91",
          "https://www.instagram.com/goalkeeper995",
          "https://discord.gg/XE8sW56",
          "https://github.com/goalkeeper91"
        ]
      }
    </script>
    <script>
      // bot.goalkeeper91.de is a Paddle-facing storefront restricted to the
      // Twitch Bot SaaS product only (see src/lib/botDomain.ts) - the global
      // JSON-LD above describes the freelance/software-development business
      // instead, which is exactly the product category Paddle's Acceptable
      // Use Policy excludes, so it must not be present on that hostname at
      // all. Removed here (before the SPA even mounts) rather than only in
      // React, since a crawler reading raw HTML wouldn't see a React-time
      // removal in time anyway.
      if (location.hostname === 'bot.goalkeeper91.de') {
        var globalJsonLd = document.getElementById('global-jsonld');
        if (globalJsonLd) globalJsonLd.remove();
      }
    </script>
    <script>
      // The OBS overlay is a Browser Source, not a real visitor - nobody
      // there to give cookie consent, and a consent banner rendered over an
      // "invisible" video source is a real bug (white dialog box on top of
      // what's supposed to be a transparent timer). Skip Cookiebot/GTM
      // entirely on that one route rather than trying to hide their output
      // after the fact.
      if (!location.pathname.startsWith('/overlay/')) {
        var cookiebotScript = document.createElement('script');
        cookiebotScript.id = 'Cookiebot';
        cookiebotScript.src = 'https://consent.cookiebot.com/uc.js';
        cookiebotScript.setAttribute('data-cbid', '1273f5fe-7c66-466a-b0bc-7a15c4b60657');
        cookiebotScript.setAttribute('data-blockingmode', 'auto');
        cookiebotScript.type = 'text/javascript';
        document.head.appendChild(cookiebotScript);

        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-TMVHKMFL');
      }
    </script>
  </head>
  <body>
      <!-- Google Tag Manager (noscript) -->
      <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TMVHKMFL"
                        height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
      <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
