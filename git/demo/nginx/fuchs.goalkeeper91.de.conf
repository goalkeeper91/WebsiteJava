# fuchs.goalkeeper91.de - Vorschau-Website "Fuchs Erste-Hilfe-Abenteuer"
# (uebergangsweise hier gehostet, zieht spaeter auf eine eigene Domain um).
# Per Basic Auth abgesichert, nicht oeffentlich.
#
# WICHTIG (siehe Incident 2026-08-16, sanitaetsleitstelle.goalkeeper91.de.conf):
# absichtlich noch KEIN :443/SSL-Block hier drin. Ein ssl_certificate-Pfad,
# der beim Reload nicht existiert, verhindert den Start des GETEILTEN
# nginx-Containers und reisst ALLE Mandanten mit runter. Erst nach
# erfolgreichem Certbot-Lauf (siehe README/Anleitung) den HTTPS-Block
# ergaenzen - analog zum bereits dokumentierten Ablauf bei
# sanitaetsleitstelle/zeiterfassung.

server {
    listen 80;
    listen [::]:80;
    server_name fuchs.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        auth_basic "Fuchs Erste-Hilfe-Abenteuer - Vorschau";
        auth_basic_user_file /etc/nginx/htpasswd/fuchs;

        root /usr/share/nginx/fuchs;
        index index.html;
    }
}
