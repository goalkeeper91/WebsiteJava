# fuchs.goalkeeper91.de - ALTE Domain, jetzt reiner 301-Redirect auf
# fuchshilft.de. Zertifikat bleibt bestehen (nur der Inhalt wurde
# geaendert), damit der HTTPS-Redirect selbst sauber funktioniert statt
# mit einem Zertifikatsfehler zu scheitern.
#
# Ein-Hop-Redirect: sowohl HTTP- als auch HTTPS-Anfragen landen direkt auf
# der finalen https://fuchshilft.de-URL, kein Zwischenschritt ueber die
# alte HTTPS-Version dieser Domain.

server {
    listen 80;
    listen [::]:80;
    server_name fuchs.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fuchshilft.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fuchs.goalkeeper91.de;

    ssl_certificate /etc/nginx/certs/live/fuchs.goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/fuchs.goalkeeper91.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        return 301 https://fuchshilft.de$request_uri;
    }
}
