# fuchs.goalkeeper91.de - Website "Fuchs Erste-Hilfe-Abenteuer"
# (uebergangsweise hier gehostet, zieht spaeter auf eine eigene Domain um,
# sobald der naechste konkrete Schritt - z.B. mit Schulen - ansteht).
#
# Seit 2026-08-18 OHNE Basic Auth, also fuer jeden mit dem Link erreichbar -
# aber bewusst weiterhin nicht in Suchmaschinen gelistet (robots.txt
# disallowed alles, jede Seite traegt <meta name="robots" content="noindex,
# nofollow">). Das ist der Zwischenzustand "teilbarer Link, aber nicht
# beworben/gelistet" - kein oeffentlicher Launch.
#
# Zertifikat existiert (siehe certbot certonly --webroot -d
# fuchs.goalkeeper91.de, gueltig bis 2026-11-16) - HTTPS-Block ist deshalb
# jetzt sicher ergaenzbar (siehe Incident 2026-08-16: vorher haette ein
# ssl_certificate-Pfad, der beim Reload nicht existiert, den GETEILTEN
# nginx-Container fuer ALLE Mandanten lahmgelegt).

server {
    listen 80;
    listen [::]:80;
    server_name fuchs.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fuchs.goalkeeper91.de;

    ssl_certificate /etc/nginx/certs/live/fuchs.goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/fuchs.goalkeeper91.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Sicherheits-Header. bewusst OHNE "includeSubDomains" bei HSTS (siehe
    # Incident 2026-08-16 oben: HSTS von der Elterndomain hatte diese
    # Subdomain betroffen, bevor sie eigenes HTTPS hatte - hier soll das
    # Gegenstueck nicht fuer etwaige kuenftige Subdomains von fuchs.*
    # denselben Fehler wiederholen).
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    # Reine, handgeschriebene statische Seite: kein Inline-JS/CSS, keine
    # externen Ressourcen (keine Fonts/Analytics/CDN) - daher eine strikte
    # CSP ohne 'unsafe-inline' moeglich.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    root /usr/share/nginx/fuchs;
    index index.html;

    # Clean URLs: ".html" ist kein zeitgemaesses Erscheinungsbild in der
    # Adresszeile mehr. Alte/direkt eingegebene ".html"-URLs werden dauerhaft
    # (301) auf die saubere Variante umgeleitet, damit es pro Seite genau
    # EINE kanonische URL gibt (wichtig fuer SEO/Canonical-Tags, siehe
    # <link rel="canonical"> in den Seiten) statt zwei erreichbarer
    # Duplikate. "=" -Locations werden von nginx vor der Regex-Location
    # geprueft, daher hier zuerst der Spezialfall fuer die Startseite.
    location = /index.html {
        return 301 /;
    }
    location = /index {
        return 301 /;
    }
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # Intern wird bei z.B. "/konzept" trotzdem ganz normal die Datei
    # "konzept.html" von der Platte ausgeliefert - das ist rein
    # serverseitig, in der Adresszeile bleibt "/konzept" sichtbar.
    #
    # WICHTIG: letzter Fallback ist bewusst "$uri/index.html" (reiner
    # Datei-Check), NICHT "$uri/" - Letzteres wuerde bei einem Treffer
    # intern erneut die "index"-Direktive fuer "/index.html" ausloesen,
    # was wiederum die obige "location = /index.html"-Weiterleitung
    # trifft und eine Redirect-Schleife auf "/" erzeugt (siehe Incident
    # 2026-08-18: Clean-URL-Einfuehrung, root-Route redirectete auf sich
    # selbst).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # "/spiel" OHNE Slash faellt sonst in "location /" oben durch, wo
    # "$uri/index.html" die Datei zwar brav findet und mit 200 ausliefert -
    # aber unter der STRIKTEN CSP von "location /" (kein wasm-unsafe-eval/
    # unsafe-eval/blob:), wodurch WASM-Laden und JS-eval wieder exakt so
    # fehlschlagen wie vor den fruehren CSP-Fixes, nur eben schwerer zu
    # bemerken (kein 404, die Seite "laedt" nur nie fertig). Deshalb hier
    # ein expliziter Redirect auf die Slash-Variante, damit der Request
    # garantiert im "location /spiel/"-Block unten mit der gelockerten CSP
    # landet. "location =" wird von nginx immer vor Praefix-Locations
    # geprueft, daher unabhaengig von der Reihenfolge hier sicher.
    location = /spiel {
        return 301 /spiel/;
    }

    # /spiel/ (Godot-Web-Export des Lernspiels, siehe FuchsErsteHilfe-Repo,
    # deploy-server.yml) - braucht eine gelockerte CSP fuer die
    # WebAssembly-Kompilierung des Godot-Engine-Binaries. Eigener
    # location-Block statt die CSP oben global zu lockern, damit die
    # restliche handgeschriebene Website weiterhin die strikte CSP behaelt
    # (kein Inline-JS/CSS/WASM/eval dort noetig). WICHTIG: add_header wird
    # von nginx NICHT vom Parent-Level geerbt, sobald ein location-Block
    # selbst welche definiert - die uebrigen Sicherheits-Header muessen
    # deshalb hier wiederholt werden, sonst wuerden sie fuer /spiel/
    # stillschweigend wegfallen. try_files identisch zum "location /"-Block
    # oben, damit Clean-URL-Aufrufe wie "/spiel/index" (-> Datei
    # "index.html") gleich funktionieren.
    #
    # script-src-Zusaetze (im Live-Playtest am 2026-08-22 als konkrete CSP-
    # Verstoesse in der Browser-Konsole entdeckt, nicht vorab geraten):
    # - 'wasm-unsafe-eval': fuer WebAssembly.instantiate()/instantiateStreaming()
    #   (laedt Godots Engine-Binary).
    # - 'unsafe-eval': Godots AudioNarrator.gd nutzt JavaScriptBridge.eval()
    #   als einzige offizielle Bruecke zur Web-Speech-API fuers Klasse-1-
    #   Vorlesen (siehe Sicherheits-Kommentar dort - der ausgewertete Text
    #   stammt ausschliesslich aus fest im Spiel hinterlegten Daten, nie aus
    #   Nutzereingaben). Ohne 'unsafe-eval' bricht dieser eval()-Aufruf mit
    #   EvalError ab, wodurch die Sprachausgabe der App als "nicht
    #   verfuegbar" erscheint (kompletter Ausfall der Vorlesefunktion,
    #   Kernbestandteil des Klasse-1-Konzepts) - keine unabhaengige
    #   Alternative in Godots Web-Export vorhanden.
    # img-src-Zusatz:
    # - blob:: Godot setzt das Browser-Tab-Icon zur Laufzeit ueber eine
    #   Blob-URL (_godot_js_display_window_icon_set), sonst geblockt.
    location /spiel/ {
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        try_files $uri $uri.html $uri/index.html =404;
    }
}
