# fuchs.goalkeeper91.de - Vorschau-Website "Fuchs Erste-Hilfe-Abenteuer"
# (uebergangsweise hier gehostet, zieht spaeter auf eine eigene Domain um).
# Per Basic Auth abgesichert, nicht oeffentlich.
#
# Zertifikat existiert (siehe certbot certonly --webroot -d
# fuchs.goalkeeper91.de, gueltig bis 2026-11-16) - HTTPS-Block ist deshalb
# jetzt sicher ergaenzbar (siehe Incident 2026-08-16: vorher haette ein
# ssl_certificate-Pfad, der beim Reload nicht existiert, den GETEILTEN
# nginx-Container fuer ALLE Mandanten lahmgelegt).

server {
    listen 80;
    listen [::]:80;
    server_name fuchs.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fuchs.goalkeeper91.de;

    ssl_certificate /etc/nginx/certs/live/fuchs.goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/fuchs.goalkeeper91.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Sicherheits-Header. bewusst OHNE "includeSubDomains" bei HSTS (siehe
    # Incident 2026-08-16 oben: HSTS von der Elterndomain hatte diese
    # Subdomain betroffen, bevor sie eigenes HTTPS hatte - hier soll das
    # Gegenstueck nicht fuer etwaige kuenftige Subdomains von fuchs.*
    # denselben Fehler wiederholen).
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    # Reine, handgeschriebene statische Seite: kein Inline-JS/CSS, keine
    # externen Ressourcen (keine Fonts/Analytics/CDN) - daher eine strikte
    # CSP ohne 'unsafe-inline' moeglich.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    auth_basic "Fuchs Erste-Hilfe-Abenteuer - Vorschau";
    auth_basic_user_file /etc/nginx/htpasswd/fuchs;

    root /usr/share/nginx/fuchs;
    index index.html;
}
