# fuchshilft.de - eigenstaendige Hauptdomain fuer "Fuchs Erste-Hilfe-Abenteuer"
# (loest fuchs.goalkeeper91.de als primaere Domain ab, siehe deren Config-
# Kommentar: "uebergangsweise hier gehostet, zieht spaeter auf eine eigene
# Domain um" - genau dieser Schritt).
#
# Zertifikat existiert (certbot certonly --webroot -d fuchshilft.de -d
# www.fuchshilft.de, gueltig bis 2026-12-22) - HTTPS-Block ist deshalb
# sicher ergaenzbar (siehe Incident 2026-08-16 bei fuchs.goalkeeper91.de:
# ein ssl_certificate-Pfad, der beim Reload nicht existiert, haette den
# GETEILTEN nginx-Container fuer ALLE Mandanten lahmgelegt).
#
# Inhalt kommt (vorerst) aus demselben Verzeichnis wie fuchs.goalkeeper91.de
# (/usr/share/nginx/fuchs, siehe docker-compose.prod.yml) - sobald diese
# Domain sich bewaehrt hat, wird fuchs.goalkeeper91.de selbst zu einem
# Redirect hierher.

server {
    listen 80;
    listen [::]:80;
    server_name fuchshilft.de www.fuchshilft.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fuchshilft.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fuchshilft.de www.fuchshilft.de;

    ssl_certificate /etc/nginx/certs/live/fuchshilft.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/fuchshilft.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # www -> non-www, auch verschluesselt (kanonische Domain ohne www,
    # konsistent mit office./partner.goalkeeper91.de).
    if ($host = www.fuchshilft.de) {
        return 301 https://fuchshilft.de$request_uri;
    }

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    root /usr/share/nginx/fuchs;
    index index.html;

    location = /index.html {
        return 301 /;
    }
    location = /index {
        return 301 /;
    }
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = /spiel {
        return 301 /spiel/;
    }

    location /spiel/ {
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        try_files $uri $uri.html $uri/index.html =404;
    }
}
