# fuchshilft.de - eigenstaendige Hauptdomain fuer "Fuchs Erste-Hilfe-Abenteuer"
# (loest fuchs.goalkeeper91.de als primaere Domain ab, siehe deren Config-
# Kommentar: "uebergangsweise hier gehostet, zieht spaeter auf eine eigene
# Domain um" - genau dieser Schritt).
#
# Absichtlich zunaechst NUR der HTTP-Block: es existiert noch kein Zertifikat
# fuer fuchshilft.de. Ein HTTPS-Block mit einem ssl_certificate-Pfad, der beim
# Reload nicht existiert, wuerde den GETEILTEN nginx-Container fuer ALLE
# Mandanten lahmlegen (siehe Incident 2026-08-16 bei fuchs.goalkeeper91.de).
# Ablauf: dieser HTTP-Block zuerst live, dann certbot certonly --webroot
# -d fuchshilft.de -d www.fuchshilft.de, danach HTTPS-Block ergaenzen.
#
# Inhalt kommt (vorerst) aus demselben Verzeichnis wie fuchs.goalkeeper91.de
# (/usr/share/nginx/fuchs, siehe docker-compose.prod.yml) - sobald die neue
# Domain steht, wird fuchs.goalkeeper91.de selbst zu einem Redirect hierher.

server {
    listen 80;
    listen [::]:80;
    server_name fuchshilft.de www.fuchshilft.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fuchshilft.de$request_uri;
    }
}
