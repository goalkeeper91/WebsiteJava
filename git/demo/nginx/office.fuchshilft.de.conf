# office.fuchshilft.de - Fuchs Office (interne Betriebssoftware), neue
# Subdomain unter der eigenen Hauptdomain (loest office.goalkeeper91.de ab).
#
# Gleicher Upstream wie office.goalkeeper91.de.conf (office-api:8091),
# reiner Host-Alias - Fuchs Office macht kein Host-basiertes Dispatching
# (das betrifft nur den Partner-Portal-Container), daher reicht ein neuer
# Server-Block ohne Backend-Aenderung.
#
# Zertifikat existiert (certbot certonly --webroot -d office.fuchshilft.de,
# gueltig bis 2026-12-22).

server {
    listen 80;
    listen [::]:80;
    server_name office.fuchshilft.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name office.fuchshilft.de;

    ssl_certificate /etc/nginx/certs/live/office.fuchshilft.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/office.fuchshilft.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $office_upstream http://office-api:8091;
        proxy_pass $office_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
