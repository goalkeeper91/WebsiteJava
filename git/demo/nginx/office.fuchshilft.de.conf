# office.fuchshilft.de - Fuchs Office (interne Betriebssoftware), neue
# Subdomain unter der eigenen Hauptdomain (loest office.goalkeeper91.de ab).
#
# Gleicher Upstream wie office.goalkeeper91.de.conf (office-api:8091),
# reiner Host-Alias - Fuchs Office macht kein Host-basiertes Dispatching
# (das betrifft nur den Partner-Portal-Container), daher reicht ein neuer
# Server-Block ohne Backend-Aenderung.
#
# Reihenfolge wie ueberall in diesem Projekt: erst HTTP-only deployen,
# reloaden, certbot certonly --webroot -d office.fuchshilft.de, danach
# HTTPS-Block ergaenzen - ein ssl_certificate-Pfad ohne existierendes
# Zertifikat wuerde den GETEILTEN nginx-Container beim Reload fuer ALLE
# Mandanten lahmlegen (Incident 2026-08-16).

server {
    listen 80;
    listen [::]:80;
    server_name office.fuchshilft.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
