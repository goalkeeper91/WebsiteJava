# office.goalkeeper91.de - ALTE Domain, jetzt reiner 301-Redirect auf
# office.fuchshilft.de. Zertifikat bleibt bestehen, damit der Redirect
# selbst sauber funktioniert. Alte Sessions/Cookies verfallen einfach -
# das ist ein Login-Tool, ein erneuter Login auf der neuen Domain ist
# erwartet und unkritisch.

server {
    listen 80;
    listen [::]:80;
    server_name office.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://office.fuchshilft.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name office.goalkeeper91.de;

    ssl_certificate /etc/nginx/certs/live/office.goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/office.goalkeeper91.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        return 301 https://office.fuchshilft.de$request_uri;
    }
}
