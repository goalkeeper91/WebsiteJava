# office.goalkeeper91.de - Fuchs Office (interne Betriebssoftware)
# (fuchs_office-Repo - siehe dortiges README.md, dort auch die Vorlage
# gepflegt). Live seit 2026-08-25.
#
# WICHTIG zur Reihenfolge (Let's-Encrypt/certbot-Webroot-Flow, wie bei den
# anderen Subdomains): Der HTTPS-Server-Block unten verweist auf ein
# Zertifikat, das noch nicht existiert. nginx startet/reloaded NICHT
# erfolgreich, wenn dieses Zertifikat fehlt. Reihenfolge:
#   1. Nur den ersten (HTTP) Server-Block deployen, nginx reloaden.
#   2. Zertifikat besorgen (certbot, wie für die anderen Subdomains -
#      Webroot ist bereits über /var/www/certbot vorbereitet).
#   3. Danach den zweiten (HTTPS) Server-Block dazunehmen, nginx erneut
#      reloaden.
#
# WICHTIG Nr. 2 (siehe Incident 2026-08-16 bei der Sanitätsleitstelle-API):
# proxy_pass NIE mit einem direkten Hostnamen ("http://office-api:8091") -
# das löst nginx beim Start auf, und ein zu dem Zeitpunkt nicht laufender
# Upstream verhindert dann den kompletten Start dieses GETEILTEN
# nginx-Containers, was ALLE Mandanten mit runterreißt. Deshalb unten
# `resolver` + Variable statt direktem Hostnamen - damit löst nginx lazy
# pro Request auf, ein down-Upstream führt dann nur zu einem 502 für
# diese eine Subdomain.

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name office.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Fuchs Office
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name office.goalkeeper91.de;

    ssl_certificate /etc/nginx/certs/live/office.goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/office.goalkeeper91.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $office_upstream http://office-api:8091;
        proxy_pass $office_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live-Updates (Server-Sent Events, /api/events) - ohne dies würde
        # nginx die lang laufende SSE-Antwort zwischenpuffern statt sofort
        # durchzureichen. proxy_read_timeout großzügig, auch wenn der
        # 25s-Heartbeat der Verbindung das eigentlich schon unnötig macht.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
