# partner.fuchshilft.de - Fuchs Partner-Portal, neue Subdomain unter der
# eigenen Hauptdomain (loest partner.goalkeeper91.de ab).
#
# Gleicher Container/Upstream wie office.fuchshilft.de.conf (office-api:8091)
# - Express waehlt anhand des Hostnamens (PARTNER_PORTAL_HOSTNAME, jetzt
# kommagetrennt, siehe fuchs_office-Commit c008664) zwischen Office- und
# Partner-Portal-Frontend. WICHTIG: die Server-.env muss
# "partner.goalkeeper91.de,partner.fuchshilft.de" enthalten, sonst faellt
# diese Domain faelschlich auf die Office-Oberflaeche zurueck.
#
# Reihenfolge wie ueberall: erst HTTP-only deployen, reloaden, certbot,
# dann HTTPS-Block ergaenzen.

server {
    listen 80;
    listen [::]:80;
    server_name partner.fuchshilft.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
