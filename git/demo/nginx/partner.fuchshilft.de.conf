# partner.fuchshilft.de - Fuchs Partner-Portal, neue Subdomain unter der
# eigenen Hauptdomain (loest partner.goalkeeper91.de ab).
#
# Gleicher Container/Upstream wie office.fuchshilft.de.conf (office-api:8091)
# - Express waehlt anhand des Hostnamens (PARTNER_PORTAL_HOSTNAME, jetzt
# kommagetrennt, siehe fuchs_office-Commit c008664) zwischen Office- und
# Partner-Portal-Frontend. Server-.env enthaelt bereits
# "partner.goalkeeper91.de,partner.fuchshilft.de".
#
# Zertifikat existiert (certbot certonly --webroot -d partner.fuchshilft.de,
# gueltig bis 2026-12-22).

server {
    listen 80;
    listen [::]:80;
    server_name partner.fuchshilft.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name partner.fuchshilft.de;

    ssl_certificate /etc/nginx/certs/live/partner.fuchshilft.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/partner.fuchshilft.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $partner_upstream http://office-api:8091;
        proxy_pass $partner_upstream;
        proxy_http_version 1.1;

        # Host MUSS unveraendert durchgereicht werden - Express entscheidet
        # anhand von req.hostname, welches Frontend-Bundle/welcher
        # Router-Satz ausgeliefert wird (siehe api/src/index.js).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
