# partner.goalkeeper91.de - Fuchs Partner-Portal (externes Selbstbedienungs-
# Dashboard für HiOrg-Partner, siehe Plan-Dokument "HiOrg-Portal")
#
# Gleicher Container wie office.goalkeeper91.de.conf (derselbe
# office-api:8091-Upstream) - Express wählt anhand des Hostnamens zwischen
# den beiden Frontend-Bundles und Router-Sätzen (siehe api/src/index.js).
# Kein neuer Docker-Service/Netzwerk-Eintrag nötig. Vorlage/Quelle der
# Wahrheit ist das fuchs_office-Repo (siehe dortiges README.md,
# Abschnitt "HiOrg-Portal"), diese Kopie ist die tatsächlich im geteilten
# nginx-Container eingebundene Fassung (siehe docker-compose.prod.yml).
#
# WICHTIG zur Reihenfolge (identisch zu office.goalkeeper91.de.conf):
#   1. Nur den ersten (HTTP) Server-Block deployen, nginx reloaden.
#   2. Zertifikat besorgen (certbot, Webroot bereits über
#      /var/www/certbot vorbereitet).
#   3. Danach den zweiten (HTTPS) Server-Block dazunehmen, nginx erneut
#      reloaden.
#
# WICHTIG Nr. 2: proxy_pass NIE mit einem direkten Hostnamen - siehe
# ausführlicher Kommentar in office.goalkeeper91.de.conf (Incident
# 2026-08-16). Deshalb unten `resolver` + Variable statt direktem
# Hostnamen.

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name partner.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Fuchs Partner-Portal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name partner.goalkeeper91.de;

    ssl_certificate /etc/nginx/certs/live/partner.goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/partner.goalkeeper91.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $partner_upstream http://office-api:8091;
        proxy_pass $partner_upstream;
        proxy_http_version 1.1;

        # Host MUSS unverändert durchgereicht werden - Express entscheidet
        # anhand von req.hostname, welches Frontend-Bundle/welcher
        # Router-Satz ausgeliefert wird (siehe api/src/index.js).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
