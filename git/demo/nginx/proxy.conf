# =========================================
# MAIN SITE - goalkeeper91.de
# =========================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name goalkeeper91.de www.goalkeeper91.de;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goalkeeper91.de www.goalkeeper91.de;

    # SSL Configuration
    ssl_certificate /etc/nginx/certs/live/goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/goalkeeper91.de/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Preserved from the removed global http{} block (that block only
    # belongs in the main nginx.conf, not a conf.d fragment - see commit
    # message). client_max_body_size was previously set once for all sites
    # there; restored here since goalkeeper91.de's own app needs >1M
    # uploads (nginx's default).
    client_max_body_size 20M;

    # ===========================
    # BACKEND PROXY (Go Backend)
    # ===========================

    # Auth Endpoints
    location /auth/ {
        proxy_pass http://backend-go:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cookie Support
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain backend-go $host;
        proxy_cookie_domain localhost $host;
        proxy_cookie_path / /;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API Endpoints
    location /api/ {
        proxy_pass http://backend-go:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cookie Support
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain backend-go $host;
        proxy_cookie_domain localhost $host;
        proxy_cookie_path / /;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health Check Endpoint
    location /health {
        proxy_pass http://backend-go:8080/health;
        access_log off;
    }

    # WebSocket Support (falls separate Route)
    location /ws/ {
        proxy_pass http://backend-go:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    # ===========================
    # FRONTEND (React/Vue)
    # ===========================

    root /usr/share/nginx/html;
    index index.html;

    # Static Assets (Cache) - VOR / location!
    location ~* \.(ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # React/Vue SPA Fallback (GANZ AM ENDE!)
    location / {
        try_files $uri $uri/ /index.html;

        # index.html nicht cachen
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 404 /index.html;
}

# =========================================
# SUBATHON TIMER - timer.goalkeeper91.de
# The control panel moved into the main dashboard (goalkeeper91.de/dashboard
# ?tab=subathon) and the OBS overlay moved to goalkeeper91.de/overlay/subathon
# - both now backed by the same Go/Postgres state instead of this standalone
# app's old in-memory store. Nothing left to serve here, just redirect
# anyone with an old bookmark/OBS scene to the real site.
# =========================================

server {
    listen 80;
    listen [::]:80;
    server_name timer.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://goalkeeper91.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name timer.goalkeeper91.de;

    ssl_certificate /etc/nginx/certs/live/goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/goalkeeper91.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        return 301 https://goalkeeper91.de$request_uri;
    }
}

# =========================================
# ADMINER - db.goalkeeper91.de
# =========================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name db.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Adminer
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name db.goalkeeper91.de;

    # SSL Configuration
    ssl_certificate /etc/nginx/certs/live/goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/goalkeeper91.de/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Proxy to Adminer Container
    location / {
        proxy_pass http://adminer:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
