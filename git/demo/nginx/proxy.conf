server {
    listen 80;
    server_name goalkeeper91.de;

    root /var/www/frontend;

    # === React Frontend ===
    location / {
        index index.html;
        try_files $uri /index.html;
    }

    # Statisches Asset-Caching (optional, aber empfohlen)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri /index.html;
    }

    # === Spring Boot Backend ===
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React-Routing Fallback bei 404
    error_page 404 /index.html;

    # Sicherheit / kleine Extras
    client_max_body_size 20M;   # wenn dein Backend große Uploads erlaubt
    sendfile on;
    keepalive_timeout 65;
}
