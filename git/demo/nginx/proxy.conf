server {
    listen 80;
    server_name goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect alles auf HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name goalkeeper91.de;

    root /var/www/frontend;

    ssl_certificate /etc/nginx/certs/live/goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/goalkeeper91.de/privkey.pem;

    # === Spring Boot Backend (VOR Frontend!) ===

    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cookie Support (WICHTIG!)
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain backend $host;
        proxy_cookie_domain localhost $host;
        proxy_cookie_path / /;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cookie Support (WICHTIG!)
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain backend $host;
        proxy_cookie_domain localhost $host;
        proxy_cookie_path / /;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # === React Frontend ===

    # Static Assets (vor / location!)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # React SPA Fallback (ganz am Ende!)
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html nicht cachen
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 404 /index.html;

    client_max_body_size 20M;
    sendfile on;
    keepalive_timeout 65;
}