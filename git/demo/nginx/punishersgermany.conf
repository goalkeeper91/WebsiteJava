# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name punishersgermany.de www.punishersgermany.de;

    # Certbot / SSL Challenge Pfad
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect auf HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Punishers Germany
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name punishersgermany.de www.punishersgermany.de;

    # SSL Zertifikate
    ssl_certificate /etc/nginx/certs/live/punishersgermany.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/punishersgermany.de/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Uploads (Profilbilder, Sponsor-Logos, News-Bilder, OCR-Screenshots,
    # Hero-Video bis 100MB)
    client_max_body_size 110M;

    # ===========================
    # BACKEND PROXY (FastAPI, hinter /api - Prefix wird gestrippt)
    # ===========================
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ===========================
    # FRONTEND (React Router SSR)
    # ===========================
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
