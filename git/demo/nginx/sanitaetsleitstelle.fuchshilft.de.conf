# sanitaetsleitstelle.fuchshilft.de - Fuchs-Sanitaetsleitstelle API, neue
# Subdomain unter der eigenen Hauptdomain (parallel zu
# sanitaetsleitstelle.goalkeeper91.de, NICHT als Ersatz).
#
# Bewusst NUR als zusaetzlicher Alias gedacht, nicht als Umzug: die
# sanitaetsleitstelle.goalkeeper91.de-URL steckt vermutlich fest im
# bereits exportierten Godot-Web-Build (SyncClient.gd) - bereits laufende/
# gespeicherte Spielinstanzen wuerden brechen, wenn die alte Domain
# abgeschaltet wuerde. Die alte Domain bleibt deshalb dauerhaft (oder bis
# zu einer expliziten, separat abgestimmten Entscheidung) bestehen.
#
# Gleicher Upstream wie sanitaetsleitstelle.goalkeeper91.de.conf
# (sanitaetsleitstelle-api:8090), kein Backend-Code-Aenderung noetig -
# die API hat keine Host-basierte Pruefung. Reihenfolge wie ueberall:
# erst HTTP-only deployen, reloaden, certbot, dann HTTPS-Block ergaenzen.

server {
    listen 80;
    listen [::]:80;
    server_name sanitaetsleitstelle.fuchshilft.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
