# sanitaetsleitstelle.fuchshilft.de - Fuchs-Sanitaetsleitstelle API, neue
# Subdomain unter der eigenen Hauptdomain (parallel zu
# sanitaetsleitstelle.goalkeeper91.de, NICHT als Ersatz).
#
# Bewusst NUR als zusaetzlicher Alias gedacht, nicht als Umzug: die
# sanitaetsleitstelle.goalkeeper91.de-URL steckt vermutlich fest im
# bereits exportierten Godot-Web-Build (SyncClient.gd) - bereits laufende/
# gespeicherte Spielinstanzen wuerden brechen, wenn die alte Domain
# abgeschaltet wuerde. Die alte Domain bleibt deshalb dauerhaft (oder bis
# zu einer expliziten, separat abgestimmten Entscheidung) bestehen.
#
# Zertifikat existiert (certbot certonly --webroot -d
# sanitaetsleitstelle.fuchshilft.de, gueltig bis 2026-12-22).

server {
    listen 80;
    listen [::]:80;
    server_name sanitaetsleitstelle.fuchshilft.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sanitaetsleitstelle.fuchshilft.de;

    ssl_certificate /etc/nginx/certs/live/sanitaetsleitstelle.fuchshilft.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/sanitaetsleitstelle.fuchshilft.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $sanitaetsleitstelle_upstream http://sanitaetsleitstelle-api:8090;
        proxy_pass $sanitaetsleitstelle_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
