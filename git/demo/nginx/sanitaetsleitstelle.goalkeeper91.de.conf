# sanitaetsleitstelle.goalkeeper91.de - Fuchs-Sanitaetsleitstelle API
# (separates Repo "first_aid_kids", server/api - siehe docs/konzept-server.md
# dort). Zertifikat existiert (gueltig bis 2026-11-14).
#
# WICHTIG (siehe Incident 2026-08-16): proxy_pass NIE mit einem direkten
# Hostnamen ("http://sanitaetsleitstelle-api:8090") - das loest nginx beim
# Start auf, und ein zu dem Zeitpunkt nicht laufender Upstream verhindert
# dann den kompletten Start dieses GETEILTEN nginx-Containers, was ALLE
# Mandanten mit runterreisst. Stattdessen `resolver` + Variable: damit
# loest nginx lazy pro Request auf - ein down-Upstream fuehrt dann nur zu
# einem 502 fuer diese eine Subdomain, nicht zum Totalausfall.

server {
    listen 80;
    listen [::]:80;
    server_name sanitaetsleitstelle.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sanitaetsleitstelle.goalkeeper91.de;

    ssl_certificate /etc/nginx/certs/live/sanitaetsleitstelle.goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/sanitaetsleitstelle.goalkeeper91.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Docker's eingebauter DNS-Resolver (Standard fuer user-defined bridge
    # networks) - siehe Kommentar oben, warum das hier nicht optional ist.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $sanitaetsleitstelle_upstream http://sanitaetsleitstelle-api:8090;
        proxy_pass $sanitaetsleitstelle_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
