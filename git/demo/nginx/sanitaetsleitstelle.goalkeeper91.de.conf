# sanitaetsleitstelle.goalkeeper91.de - Fuchs-Sanitaetsleitstelle API
# (separates Repo "first_aid_kids", server/api - siehe docs/konzept-server.md
# dort).
#
# INCIDENT 2026-08-16: der HTTPS-Block mit statischem `proxy_pass
# http://sanitaetsleitstelle-api:8090` hat, weil dieser Upstream-Container
# zu dem Zeitpunkt nicht lief, den KOMPLETTEN nginx-Start verhindert -
# nginx loest proxy_pass-Hostnamen standardmaessig beim Config-Laden auf,
# nicht pro Request. Auf diesem geteilten nginx-Container reisst das ALLE
# Mandanten mit runter, nicht nur diese eine Subdomain. Deshalb hier
# vorerst nur HTTP-only, bis der Upstream-Container zuverlaessig laeuft -
# danach Wiederaktivierung nur noch mit `resolver`+Variable (lazy DNS
# resolution), nie wieder mit direktem Hostnamen im proxy_pass.
# Zertifikat existiert bereits (gueltig bis 2026-11-14), das ist nicht das
# Problem - kann bei Wiederaktivierung sofort mitgenutzt werden.

server {
    listen 80;
    listen [::]:80;
    server_name sanitaetsleitstelle.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
