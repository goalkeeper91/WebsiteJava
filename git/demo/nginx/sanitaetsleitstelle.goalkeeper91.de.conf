# sanitaetsleitstelle.goalkeeper91.de - Fuchs-Sanitaetsleitstelle API
# (separates Repo "first_aid_kids", server/api - siehe docs/konzept-server.md
# dort). Quelle dieser Datei: server/api/nginx/ im first_aid_kids-Repo.
#
# PHASE 1 (aktueller Stand): nur HTTP-Block aktiv, kein Zertifikat noch
# vorhanden - der HTTPS-Block unten ist absichtlich auskommentiert, siehe
# server/api/README.md im first_aid_kids-Repo fuer die volle Reihenfolge.
# Nach erfolgreichem certbot-Lauf wird der HTTPS-Block hier aktiviert und
# erneut deployed.

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name sanitaetsleitstelle.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

