# sanitaetsleitstelle.goalkeeper91.de - ALTE Domain, jetzt reiner
# Redirect auf sanitaetsleitstelle.fuchshilft.de. Nutzer-Bestaetigung:
# bisherige Spiel-Deployments waren nur Testinstanzen, keine echten im
# Umlauf befindlichen Builds - der urspruenglich befuerchtete Bruch
# bereits exportierter Godot-Clients (SyncClient.gd) entfaellt damit.
# Zertifikat bleibt bestehen, damit der Redirect selbst sauber
# funktioniert.
#
# 308 statt 301: diese Domain bedient ausschliesslich POST-Requests
# (/validateJoinCode, /syncProgress) - ein 301/302 wuerde die Methode bei
# manchen Clients auf GET herunterstufen (HTTP-Standardverhalten), 308
# ("Permanent Redirect") erhaelt Methode UND Body.

server {
    listen 80;
    listen [::]:80;
    server_name sanitaetsleitstelle.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://sanitaetsleitstelle.fuchshilft.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sanitaetsleitstelle.goalkeeper91.de;

    ssl_certificate /etc/nginx/certs/live/sanitaetsleitstelle.goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/sanitaetsleitstelle.goalkeeper91.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        return 308 https://sanitaetsleitstelle.fuchshilft.de$request_uri;
    }
}
