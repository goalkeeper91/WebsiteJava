# sanitaetsleitstelle.goalkeeper91.de - Fuchs-Sanitaetsleitstelle API
# (separates Repo "first_aid_kids", server/api - siehe docs/konzept-server.md
# dort). Quelle dieser Datei: server/api/nginx/ im first_aid_kids-Repo.
#
# PHASE 2 (aktiv): Zertifikat wurde per certbot ausgestellt
# (sanitaetsleitstelle.goalkeeper91.de, gueltig bis 2026-11-14), HTTPS-Block
# ist deshalb jetzt aktiviert.

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name sanitaetsleitstelle.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Fuchs-Sanitaetsleitstelle API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sanitaetsleitstelle.goalkeeper91.de;

    ssl_certificate /etc/nginx/certs/live/sanitaetsleitstelle.goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/sanitaetsleitstelle.goalkeeper91.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://sanitaetsleitstelle-api:8090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
