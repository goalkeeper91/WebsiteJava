# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name timer.goalkeeper91.de;

    # Certbot / SSL Challenge Pfad
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect auf HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Timer
server {
    listen 443 ssl http2;
    server_name timer.goalkeeper91.de;

    # SSL Zertifikate
    ssl_certificate /etc/nginx/certs/live/timer.goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/timer.goalkeeper91.de/privkey.pem;

    # Root Directory
    root /var/www/subathon;
    index index.html;

    # CORS Headers für OBS (WICHTIG!)
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Main Location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JavaScript Module Support (ES6)
    location ~ \.js$ {
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        # CORS auch hier wichtig!
        add_header Access-Control-Allow-Origin * always;
    }

    # CSS Files
    location ~ \.css$ {
        add_header Content-Type text/css;
        add_header Cache-Control "public, max-age=3600";
    }

    # Wichtig für JS-Module
    include /etc/nginx/mime.types;

    # Performance
    client_max_body_size 10M;
    keepalive_timeout 65;
}