server {
    listen 80;
    server_name subathon.deinedomain.de;

    # Certbot / SSL Challenge Pfad (Wichtig!)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect auf HTTPS (wenn du SSL fertig hast)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name subathon.deinedomain.de;

    ssl_certificate /etc/nginx/certs/live/subathon.deinedomain.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/subathon.deinedomain.de/privkey.pem;

    root /var/www/subathon;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Wichtig für JS-Module
    include /etc/nginx/mime.types;
}