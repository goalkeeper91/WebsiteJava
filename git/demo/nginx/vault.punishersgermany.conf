# vault.punishersgermany.de - Vaultwarden (Social Media Manager credential
# vault, embedded via <iframe> in PunishersGer's /admin/social-media - see
# that repo's docker-compose.yml for the `vaultwarden` service itself, which
# joins this same goalkeeper_prod_network and is reachable here by service
# name). Deliberately does NOT set X-Frame-Options - Vaultwarden already
# sends its own CSP frame-ancestors header (from ALLOWED_IFRAME_ANCESTORS in
# its container env), which is what actually needs to allow this domain to
# embed it. Adding a conflicting XFO header here would be redundant at best.

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name vault.punishersgermany.de;

    # Certbot / SSL Challenge Pfad
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Vaultwarden
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vault.punishersgermany.de;

    # SSL Zertifikate - separates Zertifikat für diese Subdomain, siehe
    # README für den einmaligen certbot-Befehl dafür.
    ssl_certificate /etc/nginx/certs/live/vault.punishersgermany.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/vault.punishersgermany.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://vaultwarden:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support - Vaultwarden uses this for live sync
        # notifications between clients.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
