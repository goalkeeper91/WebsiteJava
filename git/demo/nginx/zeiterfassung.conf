# zeiterfassung.goalkeeper91.de - Zeiterfassung Dashboard (Demo/Portfolio-
# Projekt, separates Repo "zeiterfassung-dashboard"). Container-Name im
# proxy_pass unten muss zum Service-Namen in dessen docker-compose.yml
# passen (joint diesem Netzwerk als externem "shared"-Netzwerk bei).
#
# ACHTUNG beim erstmaligen Ausrollen: den :443-Block erst aktivieren, wenn
# das Zertifikat unter /etc/nginx/certs/live/zeiterfassung.goalkeeper91.de/
# tatsächlich existiert - sonst schlägt der Reload für DIESEN EINEN
# geteilten nginx-Container fehl und reißt alle anderen Tenants
# (goalkeeper91.de, n8n, punishersgermany.de, vault) mit runter. Siehe
# DEPLOYMENT.md im zeiterfassung-dashboard-Repo für den vollständigen Ablauf.

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name zeiterfassung.goalkeeper91.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Zeiterfassung Dashboard
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zeiterfassung.goalkeeper91.de;

    ssl_certificate /etc/nginx/certs/live/zeiterfassung.goalkeeper91.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/zeiterfassung.goalkeeper91.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Demo-/Portfolio-Projekt, nicht öffentlich - nur wer die Zugangsdaten
    # hat, soll die Seite überhaupt sehen.
    auth_basic "Zeiterfassung Demo";
    auth_basic_user_file /etc/nginx/htpasswd/zeiterfassung;

    location / {
        proxy_pass http://zeiterfassung:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
